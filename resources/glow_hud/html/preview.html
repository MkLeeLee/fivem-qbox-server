<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glow HUD Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1412; }
  #scene { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
  #backdrop { position: fixed; inset: 0; background: linear-gradient(#2c3550, #5a4a58 45%, #1c1f1e 46%, #101312); }
  #map { position: fixed; left: 1vw; bottom: 8vh; width: 14vw; height: 18vh; background: #4d6a70; opacity: .9; }
  #controls { position: fixed; left: 50%; top: 9vh; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
  button { padding: 6px 14px; font: 15px sans-serif; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="map"></div>
<iframe id="scene" src="index.html"></iframe>
<div id="controls">
  <button data-mode="foot">On foot</button>
  <button data-mode="car">Car</button>
  <button data-mode="air">Plane</button>
</div>
<script>
  // Dev-only page: feeds the HUD the same messages client.lua sends. Not listed in fxmanifest.lua.
  const frame = document.getElementById('scene');
  const send = (data) => frame.contentWindow.postMessage(data, '*');
  let mode = new URLSearchParams(location.search).get('mode') || 'car';

  function setMode(next) {
    mode = next;
    send({ action: 'mode', mode: next === 'foot' ? 'none' : next });
  }

  document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  frame.addEventListener('load', () => {
    send({ action: 'visible', show: true });
    send({ action: 'anchor', left: 0.01, width: 0.14, bottom: 0.012 });
    send({ action: 'location', direction: 'W', street: 'Glory Way', area: 'East Vinewood' });
    setMode(mode);

    let t = 0;
    setInterval(() => {
      t += 0.1;
      const wave = (Math.sin(t / 3) + 1) / 2;
      send({
        action: 'player', health: 100, armor: 55, hunger: 72, thirst: 58, stress: 24, stamina: 88,
        talking: Math.sin(t / 2) > 0, voiceRange: 8,
      });
      if (mode === 'car') {
        send({
          action: 'car', speed: 40 + wave * 60, unit: 'MPH', rpm: 0.25 + wave * 0.5, fuel: 64, engine: 100,
          running: true, hasBelt: true, belt: true, lights: false,
        });
      } else if (mode === 'air') {
        send({
          action: 'air', speed: 130 + wave * 20, altitude: 9600 + wave * 80, agl: 1600 + wave * 80,
          pitch: 6 * Math.sin(t / 4), roll: 12 * Math.sin(t / 5), gear: 'down', engine: 100, running: true,
        });
      }
    }, 100);
  });
</script>
</body>
</html>
