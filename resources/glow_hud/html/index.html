<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glow HUD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud" class="hidden">

  <div id="location">
    <span class="pill" id="direction">N</span>
    <span class="pill" id="street"></span>
    <span class="pill" id="area"></span>
  </div>

  <div id="stats">
    <div class="stat armor">
      <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.700 8-6 8-11V5z"/></svg>
      <b id="armor-value">0</b>
      <div class="segments" id="armor-bar"></div>
    </div>
    <div class="stat health">
      <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 21C5 15.500 2 12 2 8a5 5 0 0 1 10-1.500A5 5 0 0 1 22 8c0 4-3 7.500-10 13z"/></svg>
      <b id="health-value">0</b>
      <div class="bar"><i id="health-bar"></i></div>
    </div>
    <div id="needs">
      <div class="need hunger">
        <div class="need-bar"><i id="hunger-bar"></i></div>
        <svg viewBox="0 0 24 24"><path d="M3 12h18a9 9 0 0 1-18 0zM7 12c-1-4 2-6 4-5 1-3 6-2 6 1 2 0 3 2 2 4"/></svg>
      </div>
      <div class="need thirst">
        <div class="need-bar"><i id="thirst-bar"></i></div>
        <svg viewBox="0 0 24 24"><path d="M5 3h14l-2 18H7zM6 10c3-1.500 5 1 12 0"/></svg>
      </div>
      <div class="need stress">
        <div class="need-bar"><i id="stress-bar"></i></div>
        <svg viewBox="0 0 24 24"><path d="M12 4v16M12 6a3 3 0 0 0-5-1 3 3 0 0 0-3 4 4 4 0 0 0 0 6 3 3 0 0 0 3 4 3 3 0 0 0 5 0M12 6a3 3 0 0 1 5-1 3 3 0 0 1 3 4 4 4 0 0 1 0 6 3 3 0 0 1-3 4 3 3 0 0 1-5 0M7 10c1 1 3 1 5 0M17 14c-1-1-3-1-5 0"/></svg>
      </div>
      <div class="need stamina">
        <div class="need-bar"><i id="stamina-bar"></i></div>
        <svg viewBox="0 0 24 24"><circle cx="15" cy="4" r="2"/><path d="M6 11l4-4 4 2 2 4 3 1M14 9l-3 5 3 3v5M11 14l-2 3-4 1"/></svg>
      </div>
    </div>
  </div>

  <div id="cluster">
    <div id="speedo" class="panel-hidden">
      <svg id="gauge" viewBox="0 0 400 400">
        <path id="fuel-track" class="arc track" pathLength="100"/>
        <path id="fuel-arc" class="arc fuel" pathLength="100"/>
        <path id="rpm-track" class="arc track" pathLength="100"/>
        <path id="rpm-arc" class="arc rpm" pathLength="100"/>
        <g id="ticks"></g>
      </svg>
      <svg id="bolt" class="end-icon" viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 9-13h-6z"/></svg>
      <svg id="flame" class="end-icon" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 4 1-2 2-5 1-9z"/></svg>
      <div id="speed">0</div>
      <div id="unit">MPH</div>
      <div id="indicators">
        <span class="indicator" id="ind-fuel">FUEL</span>
        <span class="indicator" id="ind-eng">ENG</span>
        <span class="indicator" id="ind-seat">SEAT</span>
        <span class="indicator" id="ind-light">LIGHT</span>
      </div>
    </div>

    <div id="flight" class="panel-hidden">
      <div class="tape-column">
        <div class="tape-title">SPEED</div>
        <div class="tape" id="speed-tape"></div>
        <span class="indicator" id="ind-gear">GEAR</span>
      </div>
      <svg id="adi" viewBox="-150 -150 300 300">
        <defs><clipPath id="adi-clip"><circle r="128"/></clipPath></defs>
        <circle r="146" class="adi-rim"/>
        <g clip-path="url(#adi-clip)">
          <g id="adi-world">
            <rect x="-400" y="-800" width="800" height="800" class="sky"/>
            <rect x="-400" y="0" width="800" height="800" class="ground"/>
            <line x1="-400" x2="400" class="horizon"/>
            <g id="ladder"></g>
          </g>
          <g id="adi-bank"></g>
        </g>
        <path d="M0 -128 -12 -106H12z" class="adi-pointer"/>
        <path d="M-74 2H-30L0 22 30 2H74" class="adi-plane"/>
      </svg>
      <div class="tape-column">
        <div class="tape-title">ALTITUDE</div>
        <div class="tape" id="altitude-tape"></div>
        <span class="indicator" id="ind-air-eng">ENG</span>
      </div>
      <div id="agl">
        <div class="tape-title">AGL</div>
        <div id="agl-value">0</div>
      </div>
    </div>

    <div id="voice" title="Voice">
      <div id="wave"></div>
      <div id="voice-range"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
